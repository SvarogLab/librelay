[package]
name = "librelay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
libfuzzer-sys = "0.4.13"
librelay = { path = ".." }
tokio = { version = "1.54.1", features = ["io-util", "rt"] }

[[bin]]
name = "mux_server_stdin"
path = "fuzz_targets/mux_server_stdin.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_stderr_lines"
path = "fuzz_targets/server_stderr_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_filter_agreement"
path = "fuzz_targets/log_filter_agreement.rs"
test = false
doc = false
bench = false
