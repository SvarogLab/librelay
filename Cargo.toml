[package]
name = "librelay"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/SvarogLab/librelay"
description = "Shared pieces of a WSL relay: a Linux client that spawns one Windows server over WSL interop and talks to it over its stdio"

[features]
default = ["client", "server"]
# The Linux side; compiles to nothing on other targets.
client = ["dep:tokio", "dep:sd-notify", "dep:thiserror", "dep:tracing"]
# The Windows side; no async runtime, so a synchronous server stays free of tokio.
server = ["dep:clap"]

[dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"], optional = true }
thiserror = { version = "2.0.21", optional = true }
tokio = { version = "1.54.1", features = ["io-util", "io-std", "macros", "net", "process", "rt", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }

[target.'cfg(unix)'.dependencies]
sd-notify = { version = "0.5.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints.clippy]
# A module with submodules lives in `name.rs` beside `name/`, not in `name/mod.rs`.
mod_module_files = "warn"
